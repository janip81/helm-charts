{{- if .Values.discordBot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zomboid-server.fullname" . }}-discord-bot
  labels:
    {{- include "zomboid-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: discord-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "zomboid-server.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: discord-bot
  template:
    metadata:
      labels:
        {{- include "zomboid-server.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: discord-bot
    spec:
      containers:
        - name: discord-bot
          image: "{{ .Values.discordBot.image.repository }}:{{ .Values.discordBot.image.tag }}"
          imagePullPolicy: {{ .Values.discordBot.image.pullPolicy }}
          args:
            - --server-name={{ .Values.zomboid.serverName }}
            - --rcon-host={{ .Values.discordBot.rcon.host | default (printf "%s-rcon" (include "zomboid-server.fullname" .)) }}:{{ .Values.discordBot.rcon.port }}
            {{- if .Values.discordBot.channelId }}
            - --discord-channel-id={{ .Values.discordBot.channelId }}
            {{- end }}
            {{- if .Values.discordBot.appId }}
            - --discord-app-id={{ .Values.discordBot.appId }}
            {{- end }}
            {{- if .Values.discordBot.guildId }}
            - --discord-guild-id={{ .Values.discordBot.guildId }}
            {{- end }}
            {{- if .Values.exporter.enabled }}
            - --metrics-url=http://{{ include "zomboid-server.fullname" . }}-metrics:{{ .Values.exporter.port }}/metrics
            {{- end }}
            {{- if .Values.discordBot.mqtt.broker }}
            - --mqtt-broker={{ .Values.discordBot.mqtt.broker }}
            - --mqtt-topic-prefix=zomboid/{{ .Values.zomboid.serverName }}
            {{- if .Values.discordBot.mqtt.username }}
            - --mqtt-username={{ .Values.discordBot.mqtt.username }}
            {{- end }}
            {{- end }}
            {{- if .Values.discordBot.database.enabled }}
            - --db-host={{ .Values.discordBot.database.host }}
            - --db-port={{ .Values.discordBot.database.port }}
            - --db-name={{ .Values.discordBot.database.name }}
            - --db-user={{ .Values.discordBot.database.user }}
            {{- if .Values.discordBot.bootstrapAdminIds }}
            - --bootstrap-admin-ids={{ join "," .Values.discordBot.bootstrapAdminIds }}
            {{- end }}
            {{- end }}
            {{- if .Values.discordBot.curator.naturalChat.enabled }}
            - --curator-natural-chat=true
            {{- if .Values.discordBot.curator.naturalChat.channelId }}
            - --curator-channel-id={{ .Values.discordBot.curator.naturalChat.channelId }}
            {{- end }}
            - --curator-ambient-reply-chance={{ .Values.discordBot.curator.naturalChat.ambientReplyChance }}
            - --curator-user-cooldown={{ .Values.discordBot.curator.naturalChat.userCooldown }}
            - --curator-global-cooldown={{ .Values.discordBot.curator.naturalChat.globalCooldown }}
            {{- end }}
            {{- if .Values.discordBot.curator.llm.enabled }}
            - --llm-enabled=true
            - --llm-user-cooldown={{ .Values.discordBot.curator.llm.userCooldown }}
            - --llm-global-cooldown={{ .Values.discordBot.curator.llm.globalCooldown }}
            {{- end }}
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discordBot.discordToken.existingSecret }}
                  key: {{ .Values.discordBot.discordToken.existingSecretTokenKey }}
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.zomboid.existingSecret }}
                  key: {{ .Values.zomboid.secretKeys.rconPassword }}
            {{- if and .Values.discordBot.mqtt.broker .Values.discordBot.mqtt.existingSecret }}
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discordBot.mqtt.existingSecret }}
                  key: {{ .Values.discordBot.mqtt.existingSecretPasswordKey }}
            {{- end }}
            {{- if .Values.discordBot.database.enabled }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discordBot.database.existingSecret }}
                  key: {{ .Values.discordBot.database.existingSecretPasswordKey }}
            {{- end }}
            {{- if .Values.discordBot.curator.llm.enabled }}
            {{- /*
              LLM_ALLOW_PAID is only ever injected when explicitly true --
              per curator-llm-provider-db-config.md, the absence of this
              env var (not merely its value) is part of the safety
              contract: a hot-editable Postgres allow_paid=true row alone
              must never be sufficient to enable real spending.
            */}}
            {{- if .Values.discordBot.curator.llm.allowPaid }}
            - name: LLM_ALLOW_PAID
              value: "true"
            {{- end }}
            {{- if .Values.discordBot.curator.llm.credentials.groq.existingSecret }}
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discordBot.curator.llm.credentials.groq.existingSecret }}
                  key: {{ .Values.discordBot.curator.llm.credentials.groq.existingSecretKey }}
            {{- end }}
            {{- if .Values.discordBot.curator.llm.credentials.openrouter.existingSecret }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discordBot.curator.llm.credentials.openrouter.existingSecret }}
                  key: {{ .Values.discordBot.curator.llm.credentials.openrouter.existingSecretKey }}
            {{- end }}
            {{- if .Values.discordBot.curator.llm.credentials.openai.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discordBot.curator.llm.credentials.openai.existingSecret }}
                  key: {{ .Values.discordBot.curator.llm.credentials.openai.existingSecretKey }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.discordBot.resources | nindent 12 }}
{{- end }}
