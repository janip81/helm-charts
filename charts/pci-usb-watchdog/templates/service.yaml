{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pci-usb-watchdog.fullname" . }}
  labels:
    {{- include "pci-usb-watchdog.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "pci-usb-watchdog.name" . }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
{{- end }}
