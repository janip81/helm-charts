{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pci-usb-watchdog.fullname" . }}
  labels:
    {{- include "pci-usb-watchdog.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pci-usb-watchdog.fullname" . }}
  labels:
    {{- include "pci-usb-watchdog.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pci-usb-watchdog.fullname" . }}
  labels:
    {{- include "pci-usb-watchdog.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pci-usb-watchdog.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pci-usb-watchdog.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
