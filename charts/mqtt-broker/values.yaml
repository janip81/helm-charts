image:
  repository: eclipse-mosquitto
  tag: "2.0.18"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 1883
  websocketPort: 9001

persistence:
  enabled: true
  size: 1Gi
  storageClass: vsphere-csi

auth:
  enabled: false
  username: mqttuser
  password: ChangeMe!
  existingSecret: ""  # Set to an existing secret name to use pre-created password file

config:
  allowAnonymous: true
  passwordFile: "/mosquitto/config/passwd"

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# -- Pod security context. RuntimeDefault seccomp blocks syscalls no normal app needs.
# Add `runAsNonRoot: true` (and runAsUser) here if the image runs as a non-root user.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# -- Container security context, applied to every container (incl. init and migrate containers).
securityContext:
  allowPrivilegeEscalation: false
