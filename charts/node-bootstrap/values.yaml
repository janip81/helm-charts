replicaCount: 1

image:
  repository: ghcr.io/janip81/node-bootstrap
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- Alternative to imagePullSecrets above: have the chart render its own
# pull secret from an already-base64-encoded dockerconfigjson, for when the
# node-bootstrap image repo is private and no externally-managed pull
# secret already exists in this release's namespace. If both this and
# imagePullSecrets are set, both are applied.
ghcrSecret:
  create: false
  dockerconfigjson: ""

# -- kube-apiserver endpoint embedded in every generated join script
# (the cluster's VIP, not an individual control-plane node).
apiEndpoint: "192.168.101.11:6443"

# -- Bearer token required on every GET /bootstrap/{name} request. Exactly
# one of existingSecret or createSecret should be used -- existingSecret
# takes precedence. In this repo's own deployment this is Vault-backed via
# AVP (kubernetes/prod-k8s/node-bootstrap#fetch-token), same pattern as
# every other app's secrets -- see cluster-config/node-bootstrap/ in
# k8s-gitops.
fetchToken:
  existingSecret: ""
  existingSecretKey: fetch-token
  createSecret: false
  value: ""

# -- Declared nodes. Each entry becomes fetchable at
# GET /bootstrap/{name} once this release syncs. osFamily: ubuntu is the
# only implemented script path today. Add `gpu:` to make it a GPU node: the
# script then installs the NVIDIA driver (ubuntu-drivers' pick, or
# gpu.driverPackage) + container toolkit, sets nvidia as containerd's
# default runtime, and labels the node nvidia.com/gpu.present=true.
# nodeIP is optional: by default the node keeps the address it already uses
# to reach the API, so it can live in any VLAN (the firewall must allow API,
# kubelet and CNI traffic to/from it).
nodes: []
  # - name: gpu-box-1
  #   k8sVersion: "1.37.0"
  #   osFamily: ubuntu
  #   # nodeIP: 192.168.81.20   # optional pin, default = auto-detect
  #   labels:
  #     node.kubernetes.io/baremetal: "true"
  #   taints:
  #     - key: dedicated
  #       value: gpu
  #       effect: NoSchedule
  #   gpu:
  #     vendor: nvidia
  #     # driverPackage: nvidia-driver-580-server  # optional pin

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 64Mi

service:
  enabled: true
  port: 8080

# -- Role/RoleBinding created in kube-system (NOT the release namespace --
# bootstrap tokens must live in kube-system regardless of where this app
# runs). Grants create/get/delete on Secrets in kube-system only -- the
# same broad-within-kube-system scope kubeadm's own bootstrap-token
# machinery requires; RBAC has no way to further restrict "create" by name
# since the object doesn't exist yet.
rbac:
  create: true

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
