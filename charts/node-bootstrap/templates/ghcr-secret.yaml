{{- if .Values.ghcrSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "node-bootstrap.fullname" . }}-ghcr
  labels:
    {{- include "node-bootstrap.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.ghcrSecret.dockerconfigjson | quote }}
{{- end }}
