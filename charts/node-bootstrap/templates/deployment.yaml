apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "node-bootstrap.fullname" . }}
  labels:
    {{- include "node-bootstrap.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "node-bootstrap.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "node-bootstrap.name" . }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if or .Values.imagePullSecrets .Values.ghcrSecret.create }}
      imagePullSecrets:
        {{- with .Values.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.ghcrSecret.create }}
        - name: {{ include "node-bootstrap.fullname" . }}-ghcr
        {{- end }}
      {{- end }}
      {{- if .Values.rbac.create }}
      serviceAccountName: {{ include "node-bootstrap.fullname" . }}
      {{- end }}
      containers:
        - name: node-bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APP_ENV
              value: production
            - name: APP_PORT
              value: "8080"
            - name: API_ENDPOINT
              value: {{ .Values.apiEndpoint | quote }}
            - name: NODE_REGISTRY_PATH
              value: /etc/node-bootstrap/nodes.yaml
            - name: FETCH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "node-bootstrap.fetchTokenSecretName" . }}
                  key: {{ include "node-bootstrap.fetchTokenSecretKey" . }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: registry
              mountPath: /etc/node-bootstrap/nodes.yaml
              subPath: nodes.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
      volumes:
        - name: registry
          configMap:
            name: {{ include "node-bootstrap.fullname" . }}-registry
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
