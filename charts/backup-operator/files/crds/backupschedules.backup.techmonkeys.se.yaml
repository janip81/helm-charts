apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backupschedules.backup.techmonkeys.se
spec:
  group: backup.techmonkeys.se
  names:
    kind: BackupSchedule
    listKind: BackupScheduleList
    plural: backupschedules
    singular: backupschedule
    shortNames:
    - bks
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        description: BackupSchedule creates one BackupRequest per cron tick.
        properties:
          spec:
            type: object
            required:
            - schedule
            - template
            properties:
              schedule:
                type: string
                description: Cron expression (5 fields), evaluated in timeZone.
              timeZone:
                type: string
                description: IANA time zone for the cron expression (default UTC).
              suspend:
                type: boolean
                default: false
                description: Stop creating runs (active runs continue).
              startingDeadlineSeconds:
                type: integer
                minimum: 60
                description: A tick later than this (e.g. after operator downtime) is skipped, not run late. Only the latest
                  missed tick is ever considered.
              concurrencyPolicy:
                type: string
                enum:
                - Forbid
                - Allow
                default: Forbid
                description: Forbid skips a tick while a previous run of this schedule is active.
              successfulHistoryLimit:
                type: integer
                minimum: 0
                default: 3
                description: Succeeded runs to keep. Applied each time a new run is created.
              failedHistoryLimit:
                type: integer
                minimum: 0
                default: 3
                description: Failed runs to keep. Applied each time a new run is created.
              template:
                type: object
                required:
                - sourcePVC
                - snapshotClass
                - repository
                properties:
                  sourceNamespace:
                    type: string
                    description: Namespace of the source PVC. Defaults to the request's namespace.
                  sourcePVC:
                    type: string
                  snapshotClass:
                    type: string
                  storageClass:
                    type: string
                    description: StorageClass for the temporary PVC. Defaults to the operator's DEFAULT_STORAGE_CLASS or the
                      cluster default.
                  maxAttempts:
                    type: integer
                    minimum: 1
                    maximum: 10
                    description: 'Attempts before the request is marked Failed (default: operator DEFAULT_MAX_ATTEMPTS).'
                  plugin:
                    type: object
                    description: What to back up from the volume.
                    default:
                      name: files
                    required:
                    - name
                    properties:
                      name:
                        type: string
                        enum:
                        - files
                        - archives
                        - sqlite
                        - custom
                        description: 'files: whole volume or paths; archives: archives the app writes itself; sqlite: consistent
                          SQLite copies plus other files; custom: script from configMapRef.'
                      config:
                        type: object
                        description: Plugin settings as strings (camelCase keys become PLUGIN_* variables; lists are comma
                          separated), e.g. paths, exclude, dir, pattern, newest.
                        additionalProperties:
                          type: string
                      configMapRef:
                        type: object
                        description: 'custom plugin: ConfigMap in the source namespace holding the script.'
                        required:
                        - name
                        properties:
                          name:
                            type: string
                          key:
                            type: string
                            default: plugin.sh
                    x-kubernetes-validations:
                    - rule: self.name != 'custom' || has(self.configMapRef)
                      message: custom plugin needs configMapRef
                  repository:
                    type: object
                    required:
                    - url
                    - credentialsSecret
                    description: restic repository the snapshots are stored in.
                    properties:
                      url:
                        type: string
                        description: restic repository, e.g. s3:https://s3.example/bucket/prefix, sftp:user@host:/path, rest:https://host/repo.
                          Credentials are never part of the URL; they come from credentialsSecret.
                        pattern: ^(?:(?:s3|rest):https?://[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?:/[A-Za-z0-9._~/-]*)?|sftp:[a-z_][a-z0-9_.-]{0,31}@[A-Za-z0-9.-]+:/[A-Za-z0-9._~/-]*)$
                        maxLength: 512
                      credentialsSecret:
                        type: string
                        description: 'Secret in the source namespace: RESTIC_PASSWORD (required); AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
                          for S3; RESTIC_REST_USERNAME/RESTIC_REST_PASSWORD for a REST server; ssh-privatekey + known_hosts
                          for SFTP; optional ca.crt.'
                      initialize:
                        type: boolean
                        default: true
                        description: Create the repository if it doesn't exist yet.
                      allowInsecure:
                        type: boolean
                        default: false
                        description: Allow plain-http repositories (tests only).
                  retention:
                    type: object
                    description: 'restic retention applied to this source after each successful backup. Empty: keep everything.'
                    properties:
                      keepLast:
                        type: integer
                        minimum: 1
                      keepDaily:
                        type: integer
                        minimum: 1
                      keepWeekly:
                        type: integer
                        minimum: 1
                      keepMonthly:
                        type: integer
                        minimum: 1
                  verify:
                    type: boolean
                    default: false
                    description: Read back a sample (5%) of repository data after each backup.
                  worker:
                    type: object
                    description: 'Worker identity. Default: root with only DAC_READ_SEARCH (reads any file; needs Pod Security
                      ''privileged'' in the source namespace). Set runAsUser to run non-root without capabilities (''restricted'')
                      when that user can read the volume.'
                    properties:
                      runAsUser:
                        type: integer
                        minimum: 1
                      runAsGroup:
                        type: integer
                        minimum: 0
                description: BackupRequest spec used for every run.
          status:
            type: object
            properties:
              phase:
                type: string
                enum:
                - Active
                - Suspended
              lastScheduleTime:
                type: string
                format: date-time
                description: Latest tick that was decided (run or skipped).
              nextScheduleTime:
                type: string
                format: date-time
              lastRequest:
                type: string
              lastSkipped:
                type: object
                properties:
                  time:
                    type: string
                    format: date-time
                  reason:
                    type: string
              message:
                type: string
              observedGeneration:
                type: integer
              conditions:
                type: array
                description: 'Ready: whether the source volume, credentials and repository settings are valid.'
                items:
                  type: object
                  required:
                  - type
                  - status
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Schedule
      type: string
      jsonPath: .spec.schedule
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Last
      type: date
      jsonPath: .status.lastScheduleTime
    - name: Next
      type: string
      jsonPath: .status.nextScheduleTime
