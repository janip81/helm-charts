{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apartment-search.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apartment-search.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.cnpg.enabled }}
  DATABASE_URL: {{ required "secretEnv.DATABASE_URL is required when secret.create=true and cnpg.enabled=false" .Values.secretEnv.DATABASE_URL | quote }}
  {{- end }}
{{- end }}
