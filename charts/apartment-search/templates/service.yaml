apiVersion: v1
kind: Service
metadata:
  name: {{ include "apartment-search.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apartment-search.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "apartment-search.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
